<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Aliya Madouri Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
            <div class="navbar">
                <img src="images/pfp.png" alt="" class="pfp">
                <a href="index.html">Aliya Madouri Portfolio</a>
            </div>
            <nav aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                    <li><a href="shop.html">Shop</a></li>
                </ul>
            </nav>
    </header>

    <main id="main">
        <h1>Contact</h1>
        <p>Interested in a commission or a fanart? Fill in the form below and I’ll get back to you within a few days.</p>
        <section>
            <h2>Send me a message</h2>
            <form action="#" id="contact_form"> 

                <div class="field">
                    <label for="fname">First name:</label>
                    <input type="text" id="fname" name="fname" required>
                </div>

                <div class="field">
                    <label for="lname">Last name:</label>
                    <input type="text" id="lname" name="lname" required>
                </div>

                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="field">
                    <label for="request">Type of request</label>
                    <select name="request" id="request">
                        <option disabled selected value="">Select an option</option>
                        <option value="character">Original character</option>
                        <option value="fanart">Fanart</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="message">Message: </label>
                    <textarea name="message" id="message" rows="6" required></textarea>
                </div>

                <button type="submit" class="button">Send message</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
